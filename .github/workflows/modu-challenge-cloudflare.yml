name: Deploy MODU Challenge to Cloudflare

# Push-triggered production deployment for the existing modu-challenge Worker.

on:
  push:
    branches:
      - modu-challenge-app
    paths:
      - "modu-challenge/**"
      - ".github/workflows/modu-challenge-cloudflare.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: modu-challenge-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: modu-challenge

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 673424985970ba9955b60afdf0342249
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modu-challenge/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Restore and verify bundled source
        run: npm run prepare:source

      - name: Verify behavior and stamp source version
        run: |
          npm test
          node --test scripts/deployment-safety.test.mjs
          node scripts/stamp-build.mjs

      - name: Back up and encrypt existing production D1
        run: |
          umask 077
          trap 'rm -f production-before.sql inventory-before.json' EXIT
          # Wrangler prints a signed plaintext SQL download URL; never publish it in logs.
          modu_export_log="$(mktemp)"
          if ! npx wrangler d1 export DB --remote --output=production-before.sql > "$modu_export_log" 2>&1; then
            rm -f "$modu_export_log"
            echo "D1 export failed; deployment stopped before any database changes."
            exit 1
          fi
          rm -f "$modu_export_log"
          python3 scripts/restore-backup-check.py production-before.sql restore-validation.json
          openssl cms -encrypt -binary -aes256 -in production-before.sql -out production-before.sql.cms -outform DER scripts/backup-recipient.pem
          test -s production-before.sql.cms
          rm production-before.sql
          node scripts/production-preservation.mjs sql preservation-query.sql restore-validation.json
          # --file uses D1 import and returns only a summary; --command returns
          # the read-only SELECT results required by the preservation checker.
          npx wrangler d1 execute DB --remote --json --command="$(cat preservation-query.sql)" > inventory-before.json
          node scripts/production-preservation.mjs before inventory-before.json preservation.json preservation-query.sql.tables.json
          rm inventory-before.json
          npx wrangler secret list > provider-secret-names.json

      - name: Preserve encrypted backup before migrations
        uses: actions/upload-artifact@v4
        with:
          name: modu-clear-encrypted-backup-${{ github.run_id }}
          path: |
            modu-challenge/production-before.sql.cms
            modu-challenge/restore-validation.json
            modu-challenge/preservation.json
            modu-challenge/provider-secret-names.json
          retention-days: 90
          if-no-files-found: error

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Verify existing member activity TRUST authentication and transaction preservation
        run: |
          umask 077
          trap 'rm -f inventory-after.json preservation.json.key preservation-query.sql preservation-query.sql.tables.json' EXIT
          npx wrangler d1 execute DB --remote --json --command="$(cat preservation-query.sql)" > inventory-after.json
          node scripts/production-preservation.mjs after inventory-after.json preservation.json preservation-result.json

      - name: Deploy existing Worker
        run: npx wrangler deploy

      - name: Apply member authentication provider secrets
        shell: bash
        run: |
          apply_secret() {
            local worker_name="$1"
            local secret_value="$2"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx wrangler secret put "$worker_name"
            fi
          }
          apply_secret BREVO_API_KEY "$MODU_BREVO_API_KEY"
          apply_secret BREVO_SENDER_EMAIL "$MODU_BREVO_SENDER_EMAIL"
          apply_secret GOOGLE_OAUTH_CLIENT_ID "$MODU_GOOGLE_OAUTH_CLIENT_ID"
          apply_secret GOOGLE_OAUTH_CLIENT_SECRET "$MODU_GOOGLE_OAUTH_CLIENT_SECRET"
          apply_secret NAVER_OAUTH_CLIENT_ID "$MODU_NAVER_OAUTH_CLIENT_ID"
          apply_secret NAVER_OAUTH_CLIENT_SECRET "$MODU_NAVER_OAUTH_CLIENT_SECRET"
          apply_secret PRIMARY_ADMIN_RECOVERY_TOKEN "$MODU_PRIMARY_RECOVERY_TOKEN"
        env:
          MODU_BREVO_API_KEY: ${{ secrets.MODU_BREVO_API_KEY }}
          MODU_BREVO_SENDER_EMAIL: ${{ secrets.MODU_BREVO_SENDER_EMAIL }}
          MODU_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MODU_GOOGLE_OAUTH_CLIENT_ID }}
          MODU_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MODU_GOOGLE_OAUTH_CLIENT_SECRET }}
          MODU_NAVER_OAUTH_CLIENT_ID: ${{ secrets.MODU_NAVER_OAUTH_CLIENT_ID }}
          MODU_NAVER_OAUTH_CLIENT_SECRET: ${{ secrets.MODU_NAVER_OAUTH_CLIENT_SECRET }}
          MODU_PRIMARY_RECOVERY_TOKEN: ${{ secrets.MODU_PRIMARY_RECOVERY_TOKEN }}

      - name: Verify deployed public service and real-money gates
        run: node scripts/verify-production.mjs production-verification.json

      - name: Preserve deployment verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modu-clear-deployment-evidence-${{ github.run_id }}
          path: |
            modu-challenge/preservation-result.json
            modu-challenge/production-verification.json
          retention-days: 90
          if-no-files-found: warn

      - name: Remove temporary sensitive inventory
        if: always()
        run: rm -f production-before.sql inventory-before.json inventory-after.json preservation.json.key preservation-query.sql preservation-query.sql.tables.json
