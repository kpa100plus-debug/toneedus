name: Create private MODU sample draft

on:
  push:
    branches:
      - modu-challenge-app
    paths:
      - ".github/workflows/modu-create-private-sample-draft.yml"

permissions:
  contents: read

jobs:
  create-private-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modu-challenge
    env:
      CLOUDFLARE_ACCOUNT_ID: 673424985970ba9955b60afdf0342249
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modu-challenge/package-lock.json
      - run: npm ci
      - name: Create the approved private sample draft
        run: |
          cat > /tmp/modu-private-sample-draft.sql <<'SQL'
          INSERT OR IGNORE INTO challenges (
            id, owner_id, title, summary, description, category, region,
            reward_amount, fee_rate, success_criteria, payment_trigger,
            evidence_requirements, deadline, status, funding_status, visibility
          )
          SELECT
            'chl_sample_intro_20260902',
            COALESCE(
              (SELECT user_id FROM admin_roles WHERE role = 'primary' LIMIT 1),
              (SELECT id FROM users WHERE is_admin = 1 ORDER BY created_at ASC LIMIT 1)
            ),
            '소개팅해줄 사람 찾습니다',
            '괜찮은 이성을 소개받고 싶습니다. 본인 동의 프로필만 비공개로 검토합니다.',
            '본 챌린지는 소개 후보를 찾기 위한 비공개 운영 샘플입니다. 성인 본인이 직접 동의한 프로필만 제출할 수 있습니다. 실명, 연락처, SNS 아이디, 상세 주소, 상세 직장정보는 제출하거나 공유할 수 없습니다. 플랫폼은 소개·만남 결과를 보증하거나 중개하지 않으며, 후보 선별 후에도 연락처 교환은 실행하지 않습니다.',
            'SOCIAL',
            '전국·온라인',
            1000000,
            0.10,
            '제출자가 본인 동의 사진과 연령대, 활동지역(시·도 단위), 직업·관심사·자기소개를 포함한 비식별 프로필을 제출하면 개설자가 기준에 따라 후보를 검토할 수 있습니다. 실제 소개·선정·연락처 교환은 본 초안에서 진행하지 않습니다.',
            '실제 결제·펀딩·상금 지급·정산은 PG 및 지급대행 연동 전까지 비활성입니다. 현재 보상금은 운영 구조 검토를 위한 표기값입니다.',
            '본인 동의 사진, 연령대, 활동지역(시·도 단위), 직업·관심사·자기소개만 허용합니다. 실명·연락처·SNS·상세주소·상세직장정보 및 제3자 정보는 금지합니다.',
            '2026-09-30T23:59:00+09:00',
            'DRAFT',
            'POSTED',
            'private'
          WHERE COALESCE(
            (SELECT user_id FROM admin_roles WHERE role = 'primary' LIMIT 1),
            (SELECT id FROM users WHERE is_admin = 1 ORDER BY created_at ASC LIMIT 1)
          ) IS NOT NULL;

          INSERT OR IGNORE INTO challenge_events (
            id, challenge_id, actor_id, event_type, to_status, metadata_json
          )
          SELECT
            'evt_sample_intro_20260902',
            'chl_sample_intro_20260902',
            owner_id,
            'CHALLENGE_CREATED',
            'DRAFT',
            '{"visibility":"private","purpose":"approved private sample draft"}'
          FROM challenges WHERE id = 'chl_sample_intro_20260902';

          INSERT OR IGNORE INTO audit_logs (
            id, actor_id, action, resource_type, resource_id, after_json
          )
          SELECT
            'aud_sample_intro_20260902',
            owner_id,
            'CHALLENGE_CREATE_DRAFT',
            'challenge',
            id,
            '{"status":"DRAFT","visibility":"private","external_selection":false,"money_flow":"disabled"}'
          FROM challenges WHERE id = 'chl_sample_intro_20260902';
          SQL
          npx wrangler d1 execute DB --remote --file /tmp/modu-private-sample-draft.sql
