name: Deploy MODU Challenge to Cloudflare

on:
  push:
    branches:
      - modu-challenge-app
    paths:
      - "modu-challenge/**"
      - ".github/workflows/modu-challenge-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: modu-challenge-production
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: modu-challenge

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 673424985970ba9955b60afdf0342249
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modu-challenge/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Restore and verify bundled source
        run: npm run prepare:source

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy existing Worker
        run: npx wrangler deploy
