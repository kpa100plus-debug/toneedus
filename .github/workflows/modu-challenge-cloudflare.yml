name: Deploy MODU Challenge to Cloudflare

# Push-triggered production deployment for the existing modu-challenge Worker.

on:
  push:
    branches:
      - modu-challenge-app
    paths:
      - "modu-challenge/**"
      - ".github/workflows/modu-challenge-cloudflare.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: modu-challenge-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: modu-challenge

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 673424985970ba9955b60afdf0342249
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modu-challenge/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Restore and verify bundled source
        run: npm run prepare:source

      - name: Verify behavior and stamp source version
        run: |
          npm test
          node scripts/stamp-build.mjs

      - name: Back up and encrypt existing production D1
        run: |
          npx wrangler d1 export DB --remote --output=production-before.sql
          python3 scripts/restore-backup-check.py production-before.sql restore-validation.json
          openssl cms -encrypt -binary -aes256 -in production-before.sql -out production-before.sql.cms -outform DER scripts/backup-recipient.pem
          test -s production-before.sql.cms
          rm production-before.sql
          npx wrangler d1 execute DB --remote --json --command="SELECT id,email,is_admin FROM users ORDER BY id; SELECT id,owner_id FROM challenges ORDER BY id; SELECT user_id,role FROM admin_roles ORDER BY user_id;" > inventory-before.json
          node scripts/production-preservation.mjs before inventory-before.json preservation.json
          rm inventory-before.json
          npx wrangler secret list > provider-secret-names.json

      - name: Preserve encrypted backup before migrations
        uses: actions/upload-artifact@v4
        with:
          name: modu-clear-encrypted-backup-${{ github.run_id }}
          path: |
            modu-challenge/production-before.sql.cms
            modu-challenge/restore-validation.json
            modu-challenge/preservation.json
            modu-challenge/provider-secret-names.json
          retention-days: 90
          if-no-files-found: error

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Verify existing member mission and administrator preservation
        run: |
          npx wrangler d1 execute DB --remote --json --command="SELECT id,email,is_admin FROM users ORDER BY id; SELECT id,owner_id FROM challenges ORDER BY id; SELECT user_id,role FROM admin_roles ORDER BY user_id;" > inventory-after.json
          node scripts/production-preservation.mjs after inventory-after.json preservation.json
          rm inventory-after.json

      - name: Deploy existing Worker
        run: npx wrangler deploy

      - name: Apply member authentication provider secrets
        shell: bash
        run: |
          apply_secret() {
            local worker_name="$1"
            local secret_value="$2"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx wrangler secret put "$worker_name"
            fi
          }
          apply_secret BREVO_API_KEY "$MODU_BREVO_API_KEY"
          apply_secret BREVO_SENDER_EMAIL "$MODU_BREVO_SENDER_EMAIL"
          apply_secret GOOGLE_OAUTH_CLIENT_ID "$MODU_GOOGLE_OAUTH_CLIENT_ID"
          apply_secret GOOGLE_OAUTH_CLIENT_SECRET "$MODU_GOOGLE_OAUTH_CLIENT_SECRET"
          apply_secret NAVER_OAUTH_CLIENT_ID "$MODU_NAVER_OAUTH_CLIENT_ID"
          apply_secret NAVER_OAUTH_CLIENT_SECRET "$MODU_NAVER_OAUTH_CLIENT_SECRET"
          apply_secret PRIMARY_ADMIN_RECOVERY_TOKEN "$MODU_PRIMARY_RECOVERY_TOKEN"
        env:
          MODU_BREVO_API_KEY: ${{ secrets.MODU_BREVO_API_KEY }}
          MODU_BREVO_SENDER_EMAIL: ${{ secrets.MODU_BREVO_SENDER_EMAIL }}
          MODU_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.MODU_GOOGLE_OAUTH_CLIENT_ID }}
          MODU_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.MODU_GOOGLE_OAUTH_CLIENT_SECRET }}
          MODU_NAVER_OAUTH_CLIENT_ID: ${{ secrets.MODU_NAVER_OAUTH_CLIENT_ID }}
          MODU_NAVER_OAUTH_CLIENT_SECRET: ${{ secrets.MODU_NAVER_OAUTH_CLIENT_SECRET }}
          MODU_PRIMARY_RECOVERY_TOKEN: ${{ secrets.MODU_PRIMARY_RECOVERY_TOKEN }}
